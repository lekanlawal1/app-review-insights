name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Analysis tests (quote checks, counts, weeks, versions)
        run: node --test test/*.test.mjs
      - name: Worker tests
        run: cd worker && node --test test/*.test.mjs
